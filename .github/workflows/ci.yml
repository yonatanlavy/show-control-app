name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type, lint, test, architecture, translations, Expo
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable locked package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Verify JavaScript and contracts
        run: pnpm run verify

      - name: Explain native evidence boundary
        if: always()
        run: >-
          echo "Linux CI does not verify iOS/Android native audio, Flic hardware,
          lock-screen/background behavior, physical output routes, store products,
          or performer/venue reliability; follow docs/release.md."
